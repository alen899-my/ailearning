<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Prediction</title>
<style>
    :root {
        --primary: #4361ee;
        --secondary: #3a0ca3;
        --success: #4cc9f0;
        --danger: #f72585;
        --light: #f8f9fa;
        --dark: #212529;
        --gray: #6c757d;
        --border-radius: 12px;
        --box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        --transition: all 0.3s ease;
    }
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #74ebd5, #ACB6E5);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: var(--dark);
    }
    
    .card {
        background: #fff;
        border-radius: var(--border-radius);
        padding: 30px;
        box-shadow: var(--box-shadow);
        width: 100%;
        max-width: 500px;
        transition: var(--transition);
    }
    
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }
    
    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: var(--primary);
        font-weight: 700;
        font-size: 28px;
    }
    
    .form-group {
        margin-bottom: 20px;
        position: relative;
    }
    
    label {
        display: block;
        margin-bottom: 8px;
        color: var(--dark);
        font-weight: 600;
        font-size: 14px;
    }
    
    .input-with-value {
        display: flex;
        align-items: center;
    }
    
    .value-display {
        margin-left: 10px;
        font-weight: 600;
        color: var(--primary);
        min-width: 40px;
        text-align: center;
        background: rgba(67, 97, 238, 0.1);
        padding: 4px 8px;
        border-radius: 20px;
        font-size: 14px;
    }
    
    input[type="range"] {
        width: 100%;
        height: 8px;
        -webkit-appearance: none;
        appearance: none;
        background: linear-gradient(to right, var(--primary) 0%, #e6e6e6 0%);
        outline: none;
        border-radius: 4px;
        transition: var(--transition);
    }
    
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--primary);
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        transition: var(--transition);
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
        background: var(--secondary);
    }
    
    select {
        width: 100%;
        padding: 12px 15px;
        border-radius: var(--border-radius);
        border: 1px solid #ddd;
        font-size: 16px;
        background-color: white;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234361ee' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 15px center;
        background-size: 16px;
        appearance: none;
        transition: var(--transition);
    }
    
    select:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }
    
    .toggle-group {
        display: flex;
        background: #f0f0f0;
        border-radius: var(--border-radius);
        overflow: hidden;
        margin-bottom: 15px;
    }
    
    .toggle-option {
        flex: 1;
        text-align: center;
        padding: 12px;
        cursor: pointer;
        transition: var(--transition);
    }
    
    .toggle-option.active {
        background: var(--primary);
        color: white;
        font-weight: 600;
    }
    
    .submit-btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: var(--border-radius);
        background: var(--primary);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 10px;
    }
    
    .submit-btn:hover {
        background: var(--secondary);
        transform: translateY(-2px);
    }
    
    .result-box {
        margin-top: 25px;
        padding: 20px;
        border-radius: var(--border-radius);
        text-align: center;
        font-weight: bold;
        font-size: 18px;
        color: white;
        opacity: 0;
        transform: translateY(10px);
        transition: var(--transition);
    }
    
    .result-box.show {
        opacity: 1;
        transform: translateY(0);
    }
    
    .fit {
        background: linear-gradient(to right, #28a745, #20c997);
    }
    
    .not-fit {
        background: linear-gradient(to right, #dc3545, #fd7e14);
    }
    
    .input-info {
        font-size: 12px;
        color: var(--gray);
        margin-top: 5px;
    }
    
    @media (max-width: 576px) {
        .card {
            padding: 20px;
        }
        
        h2 {
            font-size: 24px;
        }
    }
</style>
</head>
<body>

<div class="card">
    <h2>Fitness Prediction</h2>
    <form method="POST" id="fitnessForm">
        <!-- Age Input -->
        <div class="form-group">
            <label for="age">Age: <span class="value-display" id="ageValue">30</span></label>
            <input type="range" id="age" name="age" min="18" max="80" value="30" oninput="updateValue('age')">
            <div class="input-info">Slide to select your age</div>
        </div>
        
        <!-- Height Input -->
        <div class="form-group">
            <label for="height">Height: <span class="value-display" id="heightValue">175 cm</span></label>
            <input type="range" id="height" name="height" min="140" max="210" value="175" oninput="updateValue('height', ' cm')">
            <div class="input-info">Slide to select your height in centimeters</div>
        </div>
        
        <!-- Weight Input -->
        <div class="form-group">
            <label for="weight">Weight: <span class="value-display" id="weightValue">70 kg</span></label>
            <input type="range" id="weight" name="weight" min="40" max="150" value="70" oninput="updateValue('weight', ' kg')">
            <div class="input-info">Slide to select your weight in kilograms</div>
        </div>
        
        <!-- Heart Rate Input -->
        <div class="form-group">
            <label for="heart_rate">Heart Rate: <span class="value-display" id="heartRateValue">72 bpm</span></label>
            <input type="range" id="heart_rate" name="heart_rate" min="40" max="120" value="72" step="1" oninput="updateValue('heart_rate', ' bpm')">
            <div class="input-info">Normal resting heart rate: 60-100 bpm</div>
        </div>
        
        <!-- Blood Pressure Input -->
        <div class="form-group">
            <label for="blood_pressure">Blood Pressure Category</label>
            <select id="blood_pressure" name="blood_pressure">
                <option value="1">Low (Below 90/60)</option>
                <option value="2" selected>Normal (90/60 to 120/80)</option>
                <option value="3">Elevated (120/80 to 139/89)</option>
                <option value="4">High (140/90 or higher)</option>
            </select>
        </div>
        
        <!-- Sleep Hours Input -->
        <div class="form-group">
            <label for="sleep_hours">Sleep Hours: <span class="value-display" id="sleepHoursValue">7 hrs</span></label>
            <input type="range" id="sleep_hours" name="sleep_hours" min="3" max="12" value="7" step="0.5" oninput="updateValue('sleep_hours', ' hrs')">
            <div class="input-info">Recommended: 7-9 hours for adults</div>
        </div>
        
        <!-- Nutrition Quality Input -->
        <div class="form-group">
            <label for="nutrition_quality">Nutrition Quality</label>
            <select id="nutrition_quality" name="nutrition_quality">
                <option value="1">Poor (Fast food daily)</option>
                <option value="2">Below Average</option>
                <option value="3" selected>Average (Mixed diet)</option>
                <option value="4">Good (Mostly home-cooked)</option>
                <option value="5">Excellent (Balanced, nutrient-rich)</option>
            </select>
        </div>
        
        <!-- Activity Index Input -->
        <div class="form-group">
            <label for="activity_index">Activity Level</label>
            <select id="activity_index" name="activity_index">
                <option value="1">Sedentary (Little to no exercise)</option>
                <option value="2">Lightly Active (Light exercise 1-3 days/week)</option>
                <option value="3" selected>Moderately Active (Moderate exercise 3-5 days/week)</option>
                <option value="4">Very Active (Hard exercise 6-7 days/week)</option>
                <option value="5">Extremely Active (Athlete level training)</option>
            </select>
        </div>
        
        <!-- Smokes Toggle -->
        <div class="form-group">
            <label>Smoking Status</label>
            <div class="toggle-group">
                <div class="toggle-option active" data-value="no" onclick="toggleSelect(this, 'smokes')">Non-Smoker</div>
                <div class="toggle-option" data-value="yes" onclick="toggleSelect(this, 'smokes')">Smoker</div>
            </div>
            <input type="hidden" id="smokes" name="smokes" value="no">
        </div>
        
        <!-- Gender Toggle -->
        <div class="form-group">
            <label>Gender</label>
            <div class="toggle-group">
                <div class="toggle-option active" data-value="M" onclick="toggleSelect(this, 'gender')">Male</div>
                <div class="toggle-option" data-value="F" onclick="toggleSelect(this, 'gender')">Female</div>
            </div>
            <input type="hidden" id="gender" name="gender" value="M">
        </div>
        
        <button type="button" class="submit-btn" onclick="predictFitness()">Predict Fitness</button>
    </form>

    <div class="result-box" id="resultBox">
        Predicted Fitness: <span id="predictionResult"></span>
    </div>
</div>

<script>
    // Update slider value displays
    function updateValue(inputId, suffix = '') {
        const input = document.getElementById(inputId);
        const valueDisplay = document.getElementById(inputId + 'Value');
        valueDisplay.textContent = input.value + suffix;
        
        // Update the gradient for visual feedback
        const percent = (input.value - input.min) / (input.max - input.min) * 100;
        input.style.background = `linear-gradient(to right, var(--primary) 0%, var(--primary) ${percent}%, #e6e6e6 ${percent}%, #e6e6e6 100%)`;
    }
    
    // Initialize all sliders on page load
    document.querySelectorAll('input[type="range"]').forEach(slider => {
        const suffix = slider.id === 'age' ? '' : 
                      slider.id === 'height' ? ' cm' : 
                      slider.id === 'weight' ? ' kg' : 
                      slider.id === 'heart_rate' ? ' bpm' : ' hrs';
        updateValue(slider.id, suffix);
    });
    
    // Toggle selection for binary options
    function toggleSelect(element, inputName) {
        const container = element.parentElement;
        const hiddenInput = document.getElementById(inputName);
        
        // Remove active class from all options
        container.querySelectorAll('.toggle-option').forEach(opt => {
            opt.classList.remove('active');
        });
        
        // Add active class to clicked option
        element.classList.add('active');
        
        // Update hidden input value
        hiddenInput.value = element.getAttribute('data-value');
    }
    
    // Simulate prediction (in a real app, this would be an API call)
    function predictFitness() {
        // Simple mock prediction based on inputs
        const age = parseInt(document.getElementById('age').value);
        const weight = parseInt(document.getElementById('weight').value);
        const height = parseInt(document.getElementById('height').value);
        const heartRate = parseInt(document.getElementById('heart_rate').value);
        const smokes = document.getElementById('smokes').value;
        const activity = parseInt(document.getElementById('activity_index').value);
        
        // Very basic "algorithm" for demonstration
        let score = 0;
        
        // Age factor (younger is better)
        if (age < 30) score += 2;
        else if (age < 50) score += 1;
        
        // BMI factor (normal weight is best)
        const bmi = weight / ((height/100) ** 2);
        if (bmi > 18.5 && bmi < 25) score += 2;
        else if (bmi > 25 && bmi < 30) score += 1;
        
        // Heart rate factor (lower is better)
        if (heartRate < 70) score += 1;
        else if (heartRate > 90) score -= 1;
        
        // Smoking factor
        if (smokes === 'no') score += 2;
        else score -= 2;
        
        // Activity factor
        score += (activity - 1);
        
        // Determine result
        const isFit = score >= 5;
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('predictionResult');
        
        resultText.textContent = isFit ? 'Fit' : 'Not Fit';
        resultBox.className = isFit ? 'result-box fit show' : 'result-box not-fit show';
        
        // Scroll to result
        resultBox.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
